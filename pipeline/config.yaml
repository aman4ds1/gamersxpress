# Pipeline configuration.
# Model names and provider order live ONLY here, never hardcoded in Python.
# Free-tier eligibility changes often, so edit these lists instead of code.
#
# Model ids below were verified against each provider's models endpoint
# (tools/list_models.py) on 2026-10-10; every enabled entry responds to a live
# call. Add `enabled: false` to keep a model listed for reference without
# using it: generate() skips disabled entries, so they cost no calls or logs.
# Mistral entries are disabled because the key is quota-limited (HTTP 429,
# error code 1300) on the free tier; re-test them before re-enabling.
#
# Provider names must match a registered provider in pipeline/providers.py.
# Each role is an ordered fallback chain: try the first, then the next, etc.
#
# `family` describes the UNDERLYING MODEL, not the hosting provider. It is how
# PLAN.md principle 4 is enforced: the writer and the verifier must use
# different model families. Examples: a Gemini model hosted by Google is
# family "google"; a Llama model served by Groq or Cerebras is family "meta";
# OpenAI's gpt-oss models on Groq are family "openai"; Mistral models are
# family "mistral". Two entries that differ only by host share one family, and
# two different lines of one vendor (gemini-3.5-flash vs gemini-3.1-pro) do not
# count as independent families.

roles:
  # fast: scoring, extraction, SEO text. Cheapest/fastest models first.
  fast:
    - provider: gemini
      # Flash-Lite: Google's budget text model, plenty for claim extraction and
      # SEO title/description; cheaper than the plain Flash used by the writer.
      model: gemini-3.5-flash-lite
      family: google
    - provider: groq
      # gpt-oss-20b: OpenAI's small open reasoning model, fast on Groq's
      # hardware; independent family (openai) so fast survives a Google outage.
      model: openai/gpt-oss-20b
      family: openai
      # Per-model provider options, passed generically through providers.py
      # (only documented keys are sent; see providers.py prepare()). These two
      # keys follow the Groq reasoning-model docs: max_completion_tokens raises
      # the output cap above the 1024 default (which is too low for complex
      # reasoning), and reasoning_effort low keeps reasoning cheap. response_format
      # json_object is intentionally absent here: calls for this role already
      # send a strict json_schema, which takes precedence over any
      # response_format option.
      options:
        max_completion_tokens: 8192
        reasoning_effort: low
    - provider: mistral
      # "latest" Mistral small: cheap Mistral fallback.
      enabled: false  # 429 on the free tier, re-test later
      model: mistral-small-latest
      family: mistral

  # writer: article generation. Gemini Flash (Google AI Studio) by default.
  writer:
    - provider: gemini
      # Flash 3.5: best quality-per-cost on this key for long prose.
      model: gemini-3.5-flash
      family: google
    - provider: gemini
      # Same-provider fallback: a second Google model so a per-model 503/429 on
      # Flash 3.5 does not immediately cost the whole Google family for the
      # writer. Verified accessible via tools/list_models.py. Family stays
      # "google", so the verifier guard still excludes Google for a Gemini draft.
      model: gemini-3.6-flash
      family: google
    - provider: groq
      # gpt-oss-120b: OpenAI's largest open model, a capable prose fallback
      # when Google is down. Family is "openai" (the model), not Groq (the host).
      model: openai/gpt-oss-120b
      family: openai
      # Groq gpt-oss options (see providers.py prepare()). response_format
      # json_object is deliberately NOT set here: the writer emits Markdown, not
      # JSON, and JSON mode would corrupt the article body. The budget bump and
      # low reasoning effort still apply so long articles are not truncated.
      options:
        max_completion_tokens: 8192
        reasoning_effort: low
    - provider: mistral
      # Medium 3.5: strongest Mistral model this key can access.
      enabled: false  # 429 on the free tier, re-test later
      model: mistral-medium-3.5
      family: mistral

  # verifier: independent claim check. Must be a different family than the
  # writer's actual family; providers.py filters matching families out at runtime.
  verifier:
    - provider: groq
      # gpt-oss-120b (primary): strongest independent family available. With the
      # usual Google writer the verifier lands here (openai vs google).
      model: openai/gpt-oss-120b
      family: openai
      # Groq gpt-oss options (see providers.py prepare()). The default 1024
      # output budget cannot hold a full clause-by-clause verdict: a reasoning
      # model that hits it returns finish_reason="length" with truncated JSON,
      # which is exactly the failure seen in the 7b1884edc474 run. Reasoning
      # tokens count against the output budget, so 8192 gives headroom.
      # reasoning_effort low keeps each call cheap.
      # response_format json_object: upstream forces valid JSON. The verifier
      # still parses it itself (generate is called without json_schema), so a
      # bad parse stays a hard FAIL instead of a SkipRun.
      options:
        max_completion_tokens: 8192
        reasoning_effort: low
        response_format: json_object
    - provider: groq
      # qwen3.8-27b: Qwen's open reasoning model on Groq, family "qwen". A
      # third family that never matches the Google writer, so the family guard
      # (PLAN.md principle 4) still holds with openai as the primary verifier.
      model: qwen/qwen3.8-27b
      family: qwen
      # Same documented gpt-style Groq keys as the gpt-oss entry above:
      # max_completion_tokens, reasoning_effort, response_format json_object.
      options:
        max_completion_tokens: 8192
        reasoning_effort: low
        response_format: json_object
    - provider: gemini
      # Flash 3.5: fallback that only serves when the writer actually used a
      # non-Google family (then "google" is eligible for the verifier).
      model: gemini-3.5-flash
      family: google
      # Gemini's documented JSON mode (generationConfig.responseMimeType =
      # "application/json"). The verifier still parses the JSON itself.
      options:
        response_mime_type: application/json
    - provider: mistral
      # Mistral fallback for cross-family reads.
      enabled: false  # 429 on the free tier, re-test later
      model: mistral-medium-3.5
      family: mistral

# Retry policy applied per provider before falling back to the next one.
# max_attempts counts the first try. Delays are seconds: base * 2**attempt,
# capped at max_delay_seconds.
#
# 429 (rate limited) and 503 (overloaded) are "the service is busy" errors: they
# use busy_delays_seconds instead of the fast exponential schedule, waiting about
# 10s then 30s (the last value repeats if max_attempts is higher). Every delay is
# randomised by +/- jitter_ratio so parallel or duplicate runs do not retry in
# lockstep. total_time_budget_seconds caps the backoff one role may spend across
# ALL its providers: once exhausted, generate() stops retrying and moves to the
# next provider (or skips the run), bounding worst-case run latency.
#
# finish_reason="length" (Gemini reports "MAX_TOKENS") means the model ran out
# of output budget and the response is truncated JSON, which must never be
# parsed. Instead retry up to length_retries times with the token budget scaled
# by length_budget_multiplier and clamped to length_budget_cap. If it is still
# truncated the caller fails the run (a verifier truncation is its own failure,
# verifier_output_invalid, not a skipped run). A 0 cap disables these retries.
retry:
  max_attempts: 3
  base_delay_seconds: 1
  max_delay_seconds: 30
  busy_delays_seconds: [10, 30]
  jitter_ratio: 0.25
  total_time_budget_seconds: 90
  length_retries: 1
  length_budget_multiplier: 2
  length_budget_cap: 20000

# Freshness windows per tier, plus a separate staleness cap (PLAN pipeline
# stage 2 / 4). ingest drops items older than their tier's window. `stale_after`
# is how old a story's NEWEST item may be before it is considered stale; scoring
# applies it later when a story is assembled from clustered candidates.
freshness:
  windows:
    1: 7 days
    2: 48 hours
    3: 24 hours
  stale_after: 7 days

# Cluster stage (pipeline/cluster.py). How long a covered story stays seen: a
# new cluster is skipped when it shares a member URL with a seen cluster, or
# when it matches a seen cluster's primary entities AND story type within this
# window. The membership-hash id is only the cache key for gathered/facts files
# now; seen/cooldown decisions are based on the coverage fields stored above.
cluster:
  seen_cooldown_days: 7
  failed_cooldown_hours: 24
  # Two headlines joined by only one shared named entity must also share this
  # many event words (content words left after removing the entity and generic
  # words) before they may merge, unless they share a specific story type
  # (review, sales, delay). Raising it makes clustering stricter.
  min_event_overlap: 1

# Facts stage (pipeline/facts.py). Extraction runs once per source; this caps
# how many claims a single source may contribute, so a long article cannot
# crowd out the story's other sources. Bumping it re-extracts cached sheets.
#
# Confirmation (PLAN.md pipeline stage 6): a story is confirmed with one tier-1
# source, or at least two independent attributed origins among the extracted
# claims (outlets repeating one origin count as one). Setting
# allow_single_origin_attributed to true additionally lets a single attributed
# (named, non-"unstated") origin confirm a story. Changing it re-extracts cached
# sheets.
facts:
  max_claims_per_source: 15
  allow_single_origin_attributed: false
  # Relative-time words the facts stage must convert to an absolute calendar
  # date before the claim is trusted. A claim that keeps one ("begins today")
  # cannot be verified and would make the page stale, so it is rewritten from
  # the source's publication date or, when no date is known, dropped.
  relative_time_words:
    - today
    - tonight
    - now
    - currently
    - this week
    - this weekend
    - yesterday
    - tomorrow
    - recently
    - soon
    - next week
    - out now

# Verifier stage (pipeline/verify.py; PLAN.md principle 4 / stage 6).
# `list_markers` is stripped from the start of each body line before values are
# extracted, so list numbering (for example "1." or "-") is not read as a fact.
# `number_whitelist` entries are {pattern, context}: a value whose normalized
# token fully matches `pattern` is ignored, and if `context` is set the value's
# raw line must also match that regex. This covers harmless numbers such as a
# calendar year used in a heading.
verify:
  list_markers: '^\s*(?:[-*+]|\d{1,3}[.)])\s+'
  number_whitelist:
    - pattern: '^(?:19|20)\d{2}$'
      context: '^#{1,6}\s'

# Single source of truth for content length limits: the SEO stage
# (pipeline/seo.py), the publish gates (pipeline/gates.py) and the Node site
# check (checks/check-articles.mjs) all read these values, so the pipeline and
# the site check can never drift apart. Edit them here only.
content_limits:
  max_title: 65
  min_description: 70
  max_description: 160
  # Minimum body word count. NOTE: docs/PLAN.md section 9 still says 300 words;
  # the owner lowered the gate to 200 in this task, so the value here is 200.
  min_words: 200

# Publish gates (pipeline/gates.py; PLAN.md section 9). Every value is code,
# never a model. `overlap` is the n-gram text-overlap check against the source
# texts gathered in data/gathered/<cluster-id>.json. Title/description lengths
# and the minimum word count live under `content_limits` above.
gates:
  min_sources: 2
  overlap:
    ngram: 8
    max_ratio: 0.2
  near_duplicate:
    title_similarity: 0.8
    window_days: 7
  banned_phrases:
    - "in today's fast-paced world"
    - "gamers everywhere"
    - "it's worth noting"
    - "needless to say"
    - "revolutionary"
    - "game-changing"
    - "in conclusion"
    - "read on"
    - "at the end of the day"
    - "without further ado"
  # Relative-time words make a page go stale the moment the reader opens it: a
  # story must use the calendar dates the facts sheet gives it instead. Matched
  # on word boundaries outside quoted spans, in the title, description and body.
  relative_time_phrases:
    - today
    - tonight
    - now
    - currently
    - this week
    - this weekend
    - yesterday
    - tomorrow
    - recently
    - soon
    - next week
    - out now
  # Consumer offers (sales, trials, free weekends). A story may include one only
  # when the facts sheet gives its date range or start date; otherwise it fails.
  offer_phrases:
    - sale
    - discount
    - game trial
    - free weekend
    - free to play
    - free play
    - play free
    - "% off"
  # Contrast connectives are allowed only when a fact states the relationship
  # (writer rule 2: never write a contrast no fact states).
  contrast_phrases:
    - rather than
    - instead of
  # A statement of intent, reasoning or design must be attributed to the speaker
  # the facts sheet names, never to a group. These phrases fail when the sheet
  # names a speaker and does not itself use the phrase.
  generic_attribution_phrases:
    - the team
    - the studio
    - the developer
    - the developers
    - the narrative team
    - narrative team
    - the dev team
    - dev team
    - the design team
    - design team
  # "full" and "complete" are hype words unless a fact states them.
  completeness_words:
    - full
    - complete

# Scoring stage (pipeline/score.py; PLAN.md section 7.4). A story is only
# covered when it is eligible AND reaches min_score; recency, tier, corroboration
# and outlet count are the inputs, plus an optional per-category boost.
#
# Eligibility (code-only, runs before any model call): a cluster needs a tier-1
# source, or sources from at least two different owners (two origins inside one
# article never confirm a story; several articles from the same owner count as
# one voice). On top of that, a headline matching any format-exclusion pattern
# is never covered. Each entry is a case-insensitive regex matched against the
# whole headline. Most use word-boundary anchors (\b) so they match whole words
# or phrases, not substrings: a bare "deals" is allowed while the exact phrase
# "best deals" is not. "\d+\s?% off" and "up to \d+%" catch discounts like
# "40% off" and "up to 28%". Editable through
# ``score.exclude_title_patterns`` in config.yaml.
score:
  min_score: 65
  # Corroborated stories (at least two distinct owners) clear a lower bar:
  # independent coverage is itself evidence, so min_score_corroborated applies
  # to them while min_score stays the bar for single-source stories.
  min_score_corroborated: 55
  # Each run tries eligible stories in score order and covers the first one
  # that confirms. max_candidates_per_run caps how many are tried; once
  # model_call_budget model calls are spent the search stops. Candidates that
  # fail confirmation are recorded in data/failed.json under "unconfirmed",
  # keyed by their member-URL hash, and skipped for the same membership until
  # the failed cooldown lapses.
  max_candidates_per_run: 3
  model_call_budget: 12
  # News value: a headline that matches one of news_verbs (as a whole word or
  # phrase) earns news_bonus extra points. A borderline single-source story is
  # then pushed over min_score, while a plain single story without a news signal
  # profile stays below the bar.
  news_bonus: 10
  news_verbs:
    - launches
    - release date
    - price
    - announces
    - unveils
    - acquires
    - appoints
    - leadership
    - delay
    - delayed
    - cancels
    - cancelled
    - reveals
    - confirms
    - launching
    - arrives
    - arriving
    - heading to
    - coming to
    - joins
    - joining
    - release
    - released
    - revealed
    - officially
    - pre-order
    - preorders
    - update
    - patch
  exclude_title_patterns:
    - '\bpodcast\b'
    - '\bshare of the week\b'
    - '\bnext week on xbox\b'
    - '\bthis week on xbox\b'
    - '\binto the omniverse\b'
    - '\bwalkthrough\b'
    - '\bgiveaway\b'
    - '\bfree this weekend\b'
    - '\bfree to play this weekend\b'
    - '\bfree play days\b'
    - '\bindie selects\b'
    - '\bgfn thursday\b'
    - '\bcoming to xbox game pass\b'
    - '\bcoming to game pass\b'
    - '\bto report (?:first|second|third|fourth|fiscal)\b'
    - '\bconference call\b'
    - '\bsale ends\b'
    - '\bbest deals\b'
    - '\d+\s?% off'
    - 'up to \d+%'
    - '\bprice drop\b'
    - '\bon sale\b'
    - '\bdiscount code\b'
    - '\bon geforce now\b'
    - '\bplayers'' choice\b'
  weights:
    tier1: 40
    tier2: 15
    owner: 10
    max_owners: 4
    # Small corroboration bonus: confirmable clusters (a tier-1 source, or two
    # or more distinct owners) rank above single-source, single-owner stories.
    corroboration: 10
    fresh_hours: 6
    fresh_bonus: 30
    day_hours: 24
    day_bonus: 20
    two_day_hours: 48
    two_day_bonus: 10

# Topical relevance gate. A cluster is on-topic when any of its member items
# comes from a source whose `topic` is "gaming". Otherwise it is on-topic only
# when the seed title or the cluster's named entities contain one of these
# keywords as a whole word or phrase (word-boundary anchored). Every source in
# the `sources` block carries a topic, "gaming" or "mixed"; a story that is
# neither gaming-source nor keyword-bearing is off-topic, annotated as such in
# the score stage, and never gathered.
relevance:
  keywords:
    - game
    - games
    - gaming
    - gamer
    - console
    - playstation
    - ps5
    - xbox
    - nintendo
    - switch
    - steam
    - pc
    - gpu
    - geforce
    - rtx
    - radeon
    - ryzen
    - handheld
    - vr
    - esports
    - dlss
    - fsr
    # Product-category phrases: hardware articles that name the product rather
    # than the company stay on-topic without requiring a brand keyword.
    - graphics card
    - graphics cards
    - video card
    - cpu
    - processor
    - vram
    - gddr6

# Safety layer (PLAN.md section 11). The kill switch reads PAUSED from the
# environment; the daily cap reads DAILY_CAP (falling back to this default).
# PUBLISH_MODE must be "draft" or "auto"; the workflow decides whether the
# working-tree changes are committed to main or opened as a pull request.
safety:
  daily_cap: 4
  publish_modes: [draft, auto]
  breaker_threshold: 3

